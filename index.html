<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIH Community - Geometry Dash Hub</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">
  <div id="root"></div>

  <!-- Data -->
  <script src="js/data.js"></script>

  <!-- Components (order doesn't matter, but they must load before app.jsx) -->
  <script type="text/babel" src="js/components/Header.jsx"></script>
  <script type="text/babel" src="js/components/Sidebar.jsx"></script>
  <script type="text/babel" src="js/components/HomeTab.jsx"></script>
  <script type="text/babel" src="js/components/DiscordTab.jsx"></script>
  <script type="text/babel" src="js/components/SubmitTab.jsx"></script>
  <script type="text/babel" src="js/components/CreatorsTab.jsx"></script>
  <script type="text/babel" src="js/components/CollabTab.jsx"></script>
  <script type="text/babel" src="js/components/HelpersTab.jsx"></script>
  <script type="text/babel" src="js/components/FishListTab.jsx"></script>
  <script type="text/babel" src="js/components/OtherListTab.jsx"></script>

  <!-- App entry -->
  <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
